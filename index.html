<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Knowledge Base</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>🗂️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  try { var t = JSON.parse(localStorage.getItem('kb.theme')); document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }
  catch (e) { document.documentElement.dataset.theme = 'light'; }
</script>
<style>
:root{
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sb:276px;
}
:root,[data-theme="light"]{
  color-scheme:light;
  --bg:#f3f4f1;--panel:#fcfcfb;--panel2:#eef0ec;--hover:#e8ebe6;--line:#dfe2dc;--line2:#cdd2ca;
  --text:#1b2330;--muted:#566070;--faint:#8a929d;
  --accent:#2747c4;--accent-soft:rgba(39,71,196,.09);--on-accent:#fff;
  --fill:#b86e0a;--fill-soft:rgba(214,138,30,.16);
  --danger:#b4361c;--danger-soft:rgba(180,54,28,.09);--ok:#2f7d4a;--warn:#b86e0a;
  --code:#f1f3ef;--code-h:#e7eae4;
  --pop:0 14px 40px rgba(27,35,48,.16),0 2px 6px rgba(27,35,48,.08);
  --tk-key:#7a3bc9;--tk-str:#21794a;--tk-com:#8a929d;--tk-num:#b2560b;--tk-fn:#2747c4;--tk-var:#b8326a;
}
[data-theme="dark"]{
  color-scheme:dark;
  --bg:#12161c;--panel:#171c24;--panel2:#1d232d;--hover:#222a35;--line:#262e3a;--line2:#323c4a;
  --text:#e3e7ed;--muted:#9ba5b2;--faint:#687382;
  --accent:#8aa4ff;--accent-soft:rgba(138,164,255,.12);--on-accent:#0d1530;
  --fill:#f2b35b;--fill-soft:rgba(242,179,91,.14);
  --danger:#f27a5e;--danger-soft:rgba(242,122,94,.12);--ok:#6fd08f;--warn:#f2b35b;
  --code:#10141a;--code-h:#1a2029;
  --pop:0 18px 48px rgba(0,0,0,.55);
  --tk-key:#c7a6ff;--tk-str:#8fdcae;--tk-com:#687382;--tk-num:#f5b36b;--tk-fn:#8aa4ff;--tk-var:#f29ac0;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14.5px/1.55 var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
kbd{font:500 11px var(--mono);padding:1px 5px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;color:var(--muted);background:var(--panel)}
.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.fill{fill:currentColor}
.i.xl{width:34px;height:34px;stroke-width:1.4}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- layout ---------- */
#app{display:flex;min-height:100vh}
#sidebar{position:sticky;top:0;height:100vh;width:var(--sb);flex:none;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
#mainwrap{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:56px;padding:9px 24px;padding-top:calc(9px + env(safe-area-inset-top,0px));background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
main{padding:26px 28px 120px;padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.page{max-width:1180px;margin:0 auto}
#scrim{display:none}
.mobile-only{display:none!important}

/* ---------- sidebar ---------- */
.sb-top{padding:16px 14px 8px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;padding:4px 6px;margin-bottom:12px}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--text);color:var(--bg);display:grid;place-items:center}
.brand .mark .i{width:15px;height:15px}
.sb-search{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--faint);text-align:left}
.sb-search span{flex:1}
.sb-search:hover{border-color:var(--line2);color:var(--muted)}
.sb-scroll{flex:1;overflow-y:auto;padding:6px 10px 16px;overscroll-behavior:contain}
.sb-link{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;color:var(--muted)}
.sb-link:hover{background:var(--hover);color:var(--text)}
.sb-link.active{background:var(--accent-soft);color:var(--accent)}
.sb-sec{margin-top:16px}
.sb-sec-h{display:flex;align-items:center;justify-content:space-between;padding:0 8px 4px;color:var(--faint);font-size:12.5px;font-weight:500}
.sb-cat-row{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;color:var(--muted)}
.sb-cat-row:hover{background:var(--hover);color:var(--text)}
.sb-cat.active>.sb-cat-row{color:var(--text);font-weight:500}
.sb-cat-row.current{background:var(--accent-soft);color:var(--accent)!important}
.sb-cat-row .t,.tlink span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.tl{list-style:none;margin:0;padding:0}
.sb-cat>.tl{margin:2px 0 6px;min-height:8px}
.ti .tl:empty{min-height:8px}
.tr{display:flex;align-items:center;gap:2px;padding:0 4px 0 calc(6px + var(--d,0)*14px);border-radius:6px;color:var(--muted);position:relative}
.tr:hover{background:var(--hover);color:var(--text)}
.tr.current{background:var(--accent-soft);color:var(--accent)}
.tw,.tw-sp{width:20px;height:28px;display:grid;place-items:center;flex:none;color:var(--faint)}
.tw .i{width:13px;height:13px;transition:transform .15s}
.tw.open .i{transform:rotate(90deg)}
.tlink{flex:1;min-width:0;display:flex;align-items:center;gap:7px;padding:4px 0;font-size:13.5px}
.tlink .i{width:15px;height:15px;opacity:.8}
.tr .tm{opacity:0}
.tr:hover .tm,.tr:focus-within .tm{opacity:1}
.sb-tags{display:flex;flex-wrap:wrap;gap:4px;padding:2px 6px}
.sb-foot{border-top:1px solid var(--line);padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px}
.sb-foot .mode{flex:1;font-size:12.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drag-ghost{opacity:.35}

/* ---------- topbar ---------- */
.crumbs{flex:1;min-width:0;display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);overflow:hidden;white-space:nowrap}
.crumbs a{overflow:hidden;text-overflow:ellipsis;padding:2px 4px;border-radius:5px}
.crumbs a:hover{color:var(--text);background:var(--hover)}
.crumbs .cur{color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.crumbs .sep{color:var(--line2)}
.top-r{display:flex;align-items:center;gap:6px;margin-left:auto}
.vars{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.var-f{display:flex;align-items:center;border:1px solid var(--line2);border-radius:8px;background:var(--panel);overflow:hidden;height:32px}
.var-f:focus-within{border-color:var(--fill);box-shadow:0 0 0 3px var(--fill-soft)}
.var-f span{font:500 12px var(--mono);color:var(--fill);padding:0 8px;height:100%;display:grid;place-items:center;background:var(--fill-soft)}
.var-f input{border:0;outline:0;background:none;width:150px;padding:0 8px;font:13px var(--mono)}
.var-f .var-x{width:24px;height:100%;color:var(--faint)}
.var-f .var-x:hover{color:var(--danger)}
.status{display:flex;align-items:center;gap:7px;height:32px;padding:0 10px;border-radius:8px;font-size:12.5px;color:var(--muted)}
.status:hover{background:var(--hover)}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.status.ok .dot{background:var(--ok)}
.status.warn .dot{background:var(--warn)}
.status.err{color:var(--danger)} .status.err .dot{background:var(--danger)}
.status.busy .dot{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
#banner:empty{display:none}
.banner{display:flex;align-items:center;gap:10px;margin:14px 28px 0;padding:10px 14px;border:1px solid var(--line);border-radius:9px;background:var(--panel);font-size:13.5px;color:var(--muted)}
.banner b{color:var(--text);font-weight:500}
.banner .btn{margin-left:auto}

/* ---------- buttons/inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 13px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);font-weight:500;font-size:13.5px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn.danger-solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{height:28px;padding:0 9px;font-size:12.5px}
.btn:disabled{opacity:.55;cursor:default}
.ib{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:8px;color:var(--muted);flex:none}
.ib:hover{background:var(--hover);color:var(--text)}
.ib.sm{width:26px;height:26px;border-radius:6px}
.ib.xs{width:22px;height:22px;border-radius:5px}
.ib.xs .i{width:14px;height:14px}
.ib.on{color:var(--fill)}
.ib.danger:hover{color:var(--danger);background:var(--danger-soft)}
.in{width:100%;height:36px;padding:0 11px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);outline:0}
.in:focus,.ta:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}

/* ---------- page header ---------- */
.page-h{display:flex;align-items:flex-start;gap:16px;margin-bottom:22px}
.ph-l{flex:1;min-width:0}
.ph-r{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
h1{font-size:26px;line-height:1.2;font-weight:600;letter-spacing:-.015em;margin:0;overflow-wrap:anywhere}
.sub{color:var(--muted);margin:6px 0 0;font-size:13.5px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:9px;font-size:12.5px;color:var(--faint)}
.sec-t{font-size:14px;font-weight:600;margin:34px 0 10px;color:var(--muted)}

/* ---------- home ---------- */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.cat-card{display:flex;flex-direction:column;gap:3px;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--panel);min-height:112px}
.cat-card:hover{border-color:var(--line2);background:var(--panel2)}
.cat-card .cc-ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--panel2);color:var(--muted);margin-bottom:auto}
.cat-card:hover .cc-ic{background:var(--panel)}
.cat-card .cc-name{font-weight:600;font-size:15px;margin-top:12px;overflow-wrap:anywhere}
.cat-card .cc-meta{font-size:12.5px;color:var(--faint)}
.cat-card.new{border-style:dashed;align-items:center;justify-content:center;color:var(--muted);gap:8px}
.rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:hover{background:var(--panel2)}
.row .i{color:var(--faint)}
.row-name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-path{color:var(--faint);font-size:12.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tags{display:flex;gap:4px}
.empty{border:1px dashed var(--line2);border-radius:12px;padding:44px 24px;text-align:center;color:var(--muted)}
.empty h2{font-size:17px;margin:0 0 6px;color:var(--text);font-weight:600}
.empty p{margin:0 auto 16px;max-width:440px}
.empty .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* ---------- folder items ---------- */
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.item{display:flex;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);min-width:0}
.item:hover{border-color:var(--line2);background:var(--panel2)}
.item-ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--panel2);color:var(--muted)}
.item-ic.folder{color:var(--accent);background:var(--accent-soft)}
.item-b{min-width:0;flex:1}
.item-n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-d{font-size:12.5px;color:var(--muted);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item-m{font-size:12px;color:var(--faint);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}

/* ---------- tags ---------- */
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:500;white-space:nowrap}
a.tag:hover{border-color:var(--accent);color:var(--accent)}
.tag.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tag span{opacity:.65;font-variant-numeric:tabular-nums}
.tag button{color:inherit;opacity:.6;margin-right:-3px;font-size:14px;line-height:1}
.tag button:hover{opacity:1;color:var(--danger)}
.tag-cloud{display:flex;flex-wrap:wrap;gap:6px}
.tags-ed{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.tag-in{border:0;outline:0;background:none;min-width:140px;height:24px;font-size:13px}
.tag-in::-webkit-calendar-picker-indicator{display:none!important}

/* ---------- boxes ---------- */
.boxes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:stretch}
.box{display:flex;flex-direction:column;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.box.full{grid-column:1/-1}
.box-h{display:flex;align-items:center;gap:8px;padding:10px 14px 0;color:var(--muted)}
.box-h h3{margin:0;font-size:13.5px;font-weight:600;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.box-h>.i{width:15px;height:15px;color:var(--faint)}
.box-h .lang{font:12px var(--mono);color:var(--faint)}
.box-b{padding:10px 14px 14px;flex:1;min-width:0}

/* markdown */
.md{overflow-wrap:anywhere}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md p,.md ul,.md ol,.md pre,.md table,.md blockquote{margin:0 0 .7em}
.md ul,.md ol{padding-left:1.3em}
.md li{margin:.15em 0}
.md h1,.md h2,.md h3,.md h4{font-size:14.5px;margin:1em 0 .4em;font-weight:600}
.md a{color:var(--accent);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 35%,transparent);text-underline-offset:2px}
.md a.wl{text-decoration:none;background:var(--accent-soft);padding:0 4px;border-radius:4px}
.md a.wl.missing{color:var(--faint);background:none;text-decoration:underline dashed}
.md code{font:12.5px var(--mono);background:var(--code);border:1px solid var(--line);padding:1px 4px;border-radius:4px}
.md pre{background:var(--code);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto}
.md pre code{border:0;padding:0;background:none}
.md table{border-collapse:collapse;display:block;overflow-x:auto;font-size:13.5px}
.md th,.md td{border:1px solid var(--line);padding:5px 9px;text-align:left}
.md th{background:var(--panel2);font-weight:600}
.md blockquote{border-left:3px solid var(--line2);padding-left:12px;color:var(--muted)}
.md hr{border:0;border-top:1px solid var(--line)}

/* code lines (view) */
.code-lines{display:flex;flex-direction:column;gap:6px}
.cl{position:relative;border-radius:7px;background:var(--code);border:1px solid var(--line);cursor:pointer;transition:border-color .12s,background .12s}
.cl:hover{border-color:var(--accent);background:var(--code-h)}
.cl pre{margin:0;padding:8px 44px 8px 12px;font:13px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word}
.cl .copy{position:absolute;top:5px;right:5px;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--faint)}
.cl:hover .copy{color:var(--accent);background:var(--accent-soft)}
.cl.copied{border-color:var(--ok)}
.cl.copied .copy{color:var(--ok)}
.cl-c{padding:0 12px 7px;font-size:12.5px;color:var(--muted);margin-top:-3px}
.cl-c::before{content:'# ';font-family:var(--mono);color:var(--faint)}
.cl.only-c{background:none;border-color:transparent;cursor:default}
.cl.only-c .cl-c{padding:4px 2px 0;margin:0;font-weight:500;color:var(--text)}
.cl.only-c .cl-c::before{content:none}
.var{color:var(--fill);background:var(--fill-soft);border-radius:4px;padding:0 3px;font-weight:500}
.var.empty{background:none;outline:1px dashed var(--fill);outline-offset:-1px}
.hljs-keyword,.hljs-selector-tag,.hljs-built_in,.hljs-type,.hljs-doctag{color:var(--tk-key)}
.hljs-string,.hljs-regexp,.hljs-addition,.hljs-char{color:var(--tk-str)}
.hljs-comment,.hljs-quote{color:var(--tk-com);font-style:italic}
.hljs-number,.hljs-literal,.hljs-symbol,.hljs-bullet,.hljs-meta{color:var(--tk-num)}
.hljs-title,.hljs-section,.hljs-name,.hljs-selector-id,.hljs-selector-class{color:var(--tk-fn)}
.hljs-variable,.hljs-template-variable,.hljs-attr,.hljs-attribute,.hljs-params,.hljs-property,.hljs-subst{color:var(--tk-var)}
.hljs-deletion{color:var(--danger)}

/* image + refs */
figure.img{margin:0}
figure.img img{display:block;max-width:100%;max-height:520px;margin:0 auto;border-radius:7px;border:1px solid var(--line);cursor:zoom-in;background:var(--panel2)}
figure.img figcaption{text-align:center;color:var(--muted);font-size:12.5px;margin-top:8px}
.refs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.refs li{display:flex;gap:9px;padding:6px 8px;border-radius:7px;align-items:flex-start}
.refs li:hover{background:var(--panel2)}
.refs .i{margin-top:3px;color:var(--faint)}
.refs a{color:var(--accent);font-weight:500}
.refs .host{color:var(--faint);font-size:12px;margin-left:6px}
.refs .note{color:var(--muted);font-size:12.5px}
.backlinks{margin-top:26px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--faint)}
.backlinks a{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border:1px solid var(--line);border-radius:7px;color:var(--muted);background:var(--panel)}
.backlinks a:hover{color:var(--accent);border-color:var(--accent)}

/* ---------- edit mode ---------- */
.title-in{width:100%;border:0;outline:0;background:none;font-size:26px;font-weight:600;letter-spacing:-.015em;padding:2px 0;border-bottom:1px dashed var(--line2)}
.title-in:focus{border-bottom-color:var(--accent)}
.box.editing{border-style:dashed;border-color:var(--line2)}
.box.editing:focus-within{border-style:solid;border-color:var(--accent)}
.box.editing .box-h{padding:8px 8px 0 6px;gap:4px}
.grip{width:24px;height:26px;display:grid;place-items:center;color:var(--faint);cursor:grab;flex:none;touch-action:none}
.grip:hover{color:var(--text)}
.box-title{flex:1;min-width:0;border:0;outline:0;background:none;font-weight:600;font-size:13.5px;padding:3px 4px;border-radius:5px}
.box-title:focus{background:var(--panel2)}
.lang-sel{height:26px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font:12px var(--mono);color:var(--muted);padding:0 4px;max-width:130px}
.md-tools{display:flex;gap:2px;margin-bottom:6px}
.tb{height:26px;min-width:28px;padding:0 6px;border-radius:5px;color:var(--muted);font-size:13px;display:inline-grid;place-items:center}
.tb:hover{background:var(--hover);color:var(--text)}
.tb code{font-family:var(--mono);font-size:12px}
.ta{width:100%;min-height:130px;resize:vertical;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:9px 11px;outline:0;line-height:1.55;overflow:hidden}
.ed-lines{display:flex;flex-direction:column;gap:6px}
.ed-line{display:flex;align-items:flex-start;gap:2px}
.ed-line .grip{height:34px}
.ed-line-f{flex:1;min-width:0;border:1px solid var(--line);border-radius:7px;background:var(--code);overflow:hidden}
.ed-line-f:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.code-in{display:block;width:100%;border:0;outline:0;background:none;resize:none;font:13px/1.6 var(--mono);padding:7px 10px;overflow:hidden;min-height:34px}
.cmt-in{display:block;width:100%;border:0;border-top:1px dashed var(--line);outline:0;background:none;font-size:12.5px;padding:4px 10px;color:var(--muted)}
.ed-line .ib{margin-top:4px}
.add-line{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:8px;height:32px;border:1px dashed var(--line2);border-radius:7px;color:var(--muted);font-size:13px}
.add-line:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:150px;border:1.5px dashed var(--line2);border-radius:8px;color:var(--muted);cursor:pointer;text-align:center;padding:16px;font-size:13.5px}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.drop .i{width:26px;height:26px}
.img-acts{display:flex;gap:6px;justify-content:center;margin:10px 0}
.ref-ed{display:flex;flex-direction:column;gap:8px}
.ref-row{display:grid;grid-template-columns:1fr 1.3fr auto;gap:6px;align-items:center}
.ref-row .in{height:32px;font-size:13px}
.ref-row .note-in{grid-column:1/3}
.add-box{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px;padding:12px;border:1px dashed var(--line2);border-radius:10px;color:var(--muted);font-size:13px}
.add-box>span{margin-right:4px}
.hint{color:var(--faint);font-size:12.5px;margin-top:12px}
.hint code{font-family:var(--mono)}
.dock{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:8px;padding:7px 7px 7px 14px;border:1px solid var(--line2);border-radius:12px;background:var(--panel);box-shadow:var(--pop);font-size:13px;color:var(--muted)}
.dock .lbl{display:flex;align-items:center;gap:6px;margin-right:6px}

/* ---------- unlock ---------- */
.center{display:grid;place-items:center;min-height:60vh}
.lock-card{width:min(380px,100%);text-align:center;padding:34px 28px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.lock-card .i.xl{color:var(--fill)}
.lock-card h1{font-size:22px;margin-top:12px}
.unlock-f{display:flex;gap:8px;margin-top:20px}
.unlock-f .in{text-align:center;letter-spacing:.3em;font-family:var(--mono)}

/* ---------- overlays ---------- */
.modal-bg{position:fixed;inset:0;z-index:100;background:rgba(10,14,20,.45);display:flex;align-items:flex-start;justify-content:center;padding:9vh 16px 16px;overflow-y:auto}
.modal{width:min(480px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--pop);padding:22px}
.modal.wide{width:min(980px,100%)}
.modal h2{margin:0 0 14px;font-size:17px;font-weight:600}
.m-body{display:flex;flex-direction:column;gap:12px}
.m-body p{margin:0;color:var(--muted)}
.m-sub{font-size:13.5px;font-weight:600;margin:8px 0 0}
.m-err{color:var(--danger);font-size:13px;margin:10px 0 0}
.m-acts{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;flex-wrap:wrap}
.note{font-size:12.5px;color:var(--faint);margin:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.help{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.help summary{cursor:pointer;font-weight:500;color:var(--text)}
.help ol{margin:8px 0 2px;padding-left:18px}
.help a{color:var(--accent);text-decoration:underline}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.palette{width:min(640px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--pop);overflow:hidden}
.pal-in{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);color:var(--faint)}
.pal-in input{flex:1;height:54px;border:0;outline:0;background:none;font-size:16px;color:var(--text)}
.pal-res{max-height:min(60vh,520px);overflow-y:auto;padding:6px}
.pal-item{display:flex;gap:11px;padding:9px 11px;border-radius:8px;align-items:flex-start;cursor:pointer}
.pal-item.sel{background:var(--accent-soft)}
.pal-item>.i{margin-top:3px;color:var(--faint)}
.pal-item.sel>.i{color:var(--accent)}
.pi-b{min-width:0;flex:1}
.pi-name{font-weight:500}
.pi-path{font-size:12px;color:var(--faint)}
.pi-snip{font-size:12.5px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-item mark{background:var(--fill-soft);color:inherit;border-radius:3px;padding:0 1px}
.pal-empty{padding:26px;text-align:center;color:var(--faint);font-size:13.5px}
.pal-foot{display:flex;justify-content:space-between;gap:10px;padding:8px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--faint)}
.menu{position:fixed;z-index:120;min-width:200px;padding:5px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--pop)}
.menu button{display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border-radius:6px;text-align:left;font-size:13.5px}
.menu button:hover{background:var(--hover)}
.menu button .i{color:var(--faint)}
.menu button.danger{color:var(--danger)} .menu button.danger .i{color:var(--danger)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.lightbox{position:fixed;inset:0;z-index:150;background:rgba(5,8,12,.86);display:grid;place-items:center;padding:24px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:6px}
#toasts{position:fixed;z-index:200;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{padding:8px 14px;border-radius:9px;background:var(--text);color:var(--bg);font-size:13px;font-weight:500;box-shadow:var(--pop);animation:tin .18s ease-out}
.toast.err{background:var(--danger);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
.hist{display:grid;grid-template-columns:280px 1fr;gap:16px;min-height:360px}
.hist-list{border:1px solid var(--line);border-radius:9px;overflow-y:auto;max-height:60vh}
.hist-item{display:block;width:100%;text-align:left;padding:9px 12px;border-top:1px solid var(--line)}
.hist-item:first-child{border-top:0}
.hist-item:hover{background:var(--panel2)}
.hist-item.sel{background:var(--accent-soft)}
.hist-item .d{font-size:12px;color:var(--faint)}
.hist-item .m{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-prev{border:1px solid var(--line);border-radius:9px;padding:14px;overflow-y:auto;max-height:60vh;background:var(--bg)}
.hist-prev .boxes{grid-template-columns:1fr}
.hist-acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .mobile-only{display:inline-grid!important}
  #sidebar{position:fixed;left:0;top:0;bottom:0;z-index:60;transform:translateX(-102%);transition:transform .2s ease;box-shadow:var(--pop)}
  body.sb-open #sidebar{transform:none}
  body.sb-open #scrim{display:block;position:fixed;inset:0;z-index:55;background:rgba(10,14,20,.4)}
  #topbar{padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
  .top-r{width:100%;justify-content:flex-end}
  .vars{margin-right:auto}
  .var-f input{width:120px}
  main{padding:18px 14px 120px}
  .banner{margin:12px 14px 0}
  .boxes{grid-template-columns:minmax(0,1fr)}
  .page-h{flex-direction:column}
  h1,.title-in{font-size:22px}
  .hist{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .ref-row{grid-template-columns:1fr auto}
  .ref-row .note-in{grid-column:1/2}
  .tr .tm{opacity:1}
  .cl .copy{color:var(--accent)}
  .status .lbl{display:none}
}

const saveExpanded = () => LS.set('expanded', [...S.expanded]);

/* ---------- data model ---------- */
function walk(nodes, fn, parents = []) {
  for (const n of nodes) {
    if (fn(n, parents) === false) return false;
    if (n.type === 'folder' && walk(n.children, fn, [...parents, n]) === false) return false;
  }
}
function findNode(c, id) {
  if (!c?.data || !id) return null; let res = null;
  walk(c.data.children, (n, parents) => { if (n.id === id) { res = { node: n, parents }; return false; } });
  return res;
}
const listOf = (c, parentId) => (!parentId || parentId === 'root') ? c.data.children : findNode(c, parentId)?.node.children;
function countFiles(nodes) { let n = 0; walk(nodes, x => { if (x.type === 'file') n++; }); return n; }

const BOX_DEFAULT_TITLE = { text: 'Notes', code: 'Code', image: 'Image', refs: 'References' };
function newBox(kind, title, width) {
  const b = { id: uid(), kind, title: title ?? BOX_DEFAULT_TITLE[kind], width: width || (kind === 'code' ? 'full' : 'half') };
  if (kind === 'text') b.content = '';
  if (kind === 'code') { b.lang = 'bash'; b.lines = [{ id: uid(), code: '', comment: '' }]; }
  if (kind === 'image') { b.src = ''; b.caption = ''; }
  if (kind === 'refs') b.items = [{ id: uid(), title: '', url: '', note: '' }];
  return b;
}
const newFile = name => ({ id: uid(), type: 'file', name, tags: [], fav: false, created: Date.now(), updated: Date.now(), boxes: [newBox('text', 'What is it?'), newBox('text', 'Types'), newBox('code', 'Code'), newBox('image', 'Image')] });
const newFolder = name => ({ id: uid(), type: 'folder', name, children: [] });

function normBox(b) {
  b.id = b.id || uid(); b.title = String(b.title ?? ''); b.width = b.width === 'full' ? 'full' : 'half';
  if (b.kind === 'code') {
    b.lang = b.lang || 'plaintext';
    b.lines = (Array.isArray(b.lines) ? b.lines : []).map(l => ({ id: l.id || uid(), code: String(l.code ?? ''), comment: String(l.comment ?? '') }));
    if (!b.lines.length) b.lines = [{ id: uid(), code: '', comment: '' }];
  } else if (b.kind === 'image') {
    b.src = typeof b.src === 'string' && /^(data:image\/|https:\/\/)/.test(b.src) ? b.src : ''; b.caption = String(b.caption ?? '');
  } else if (b.kind === 'refs') {
    b.items = (Array.isArray(b.items) ? b.items : []).map(i => ({ id: i.id || uid(), title: String(i.title ?? ''), url: String(i.url ?? ''), note: String(i.note ?? '') }));
  } else { b.kind = 'text'; b.content = String(b.content ?? ''); }
  return b;
}
function normNodes(arr) {
  return (Array.isArray(arr) ? arr : []).filter(n => n && typeof n === 'object').map(n => {
    n.id = n.id || uid(); n.name = String(n.name ?? 'Untitled');
    if (n.type === 'folder') n.children = normNodes(n.children);
    else { n.type = 'file'; n.tags = Array.isArray(n.tags) ? n.tags.map(String) : []; n.boxes = (Array.isArray(n.boxes) ? n.boxes : []).filter(b => b && typeof b === 'object').map(normBox); }
    return n;
  });
}
const normData = d => ({ children: normNodes(d && d.children) });

/* ---------- crypto ---------- */
async function deriveKey(pin, salt, iter) {
  const base = await crypto.subtle.importKey('raw', TE.encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function encryptJSON(obj, key, salt, iter) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, TE.encode(JSON.stringify(obj)));
  return { kdf: 'PBKDF2-SHA256', iter, salt: bufToB64(salt), iv: bufToB64(iv), ct: bufToB64(ct) };
}
async function decryptJSON(env, key) {
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBuf(env.iv) }, key, b64ToBuf(env.ct));
  return JSON.parse(TD.decode(pt));
}
async function keyFromEnv(env, pin) { const salt = b64ToBuf(env.salt); return { key: await deriveKey(pin, salt, env.iter), salt, iter: env.iter }; }

/* ---------- (de)serialization ---------- */
async function serializeCat(c) {
  const head = { format: 'kb-cat', v: 1, id: c.id, name: c.name, order: c.order ?? 0, locked: !!c.locked, updated: c.updated || Date.now() };
  if (!c.locked) return { ...head, data: c.data || { children: [] } };
  if (c.data && c.key) c.enc = await encryptJSON(c.data, c.key, c.salt, c.iter);
  return { ...head, enc: c.enc };
}
function parseCat(o) {
  if (!o || o.format !== 'kb-cat' || !o.id) throw new Error('Not a category file');
  return { id: String(o.id), name: String(o.name || 'Untitled'), order: o.order ?? 0, locked: !!o.locked, updated: o.updated || 0, data: o.locked ? null : normData(o.data), enc: o.locked ? o.enc : null, key: null, salt: null, iter: null, dirty: false, rev: 0 };
}
const manifest = () => ({ format: 'kb-manifest', v: 1, updated: Date.now(), cats: sortedCats().map(c => ({ id: c.id, name: c.name, locked: !!c.locked, order: c.order ?? 0, file: `cat-${c.id}.json` })) });

const persist = debounce(async () => {
  if (S.mode === 'readonly') return;
  try {
    const cats = [];
    for (const c of S.cats) { const o = await serializeCat(c); o._dirty = !!c.dirty; cats.push(o); }
    await IDB.set('cache', { v: 1, repo: S.mode === 'github' ? repoKey() : 'local', base: S.base, shas: S.shas, deleted: [...S.deleted], cats });
  } catch (e) { console.warn('Cache write failed', e); }
}, 500);

function touch(c, msg) {
  if (!canEdit() || !c) return;
  c.dirty = true; c.rev = (c.rev || 0) + 1; c.updated = Date.now();
  if (msg) S.msgs.add(c.locked ? `Update locked category “${c.name}”` : msg);
  persist();
  if (!S.editing) pushSoon();
  setStatus();
}

/* ---------- GitHub API ---------- */
const GH = {
  base() { return `https://api.github.com/repos/${encodeURIComponent(S.cfg.owner)}/${encodeURIComponent(S.cfg.repo)}`; },
  async req(method, path, body, raw) {
    const r = await fetch(this.base() + path, {
      method, cache: 'no-store',
      headers: { Authorization: 'Bearer ' + S.token, Accept: raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined
    });
    if (!r.ok) { let m = ''; try { m = (await r.json()).message; } catch { } const e = new Error(`GitHub ${r.status}${m ? ': ' + m : ''}`); e.status = r.status; throw e; }
    return raw ? r.text() : (r.status === 204 ? null : r.json());
  },
  async head() { return (await this.req('GET', `/git/ref/heads/${S.cfg.branch}`)).object.sha; },
  async tree(commitSha) {
    const c = await this.req('GET', `/git/commits/${commitSha}`);
    const t = await this.req('GET', `/git/trees/${c.tree.sha}?recursive=1`);
    const pre = dataPath() + '/', map = {};
    for (const e of t.tree) if (e.type === 'blob' && e.path.startsWith(pre) && /^cat-[\w-]+\.json$/.test(e.path.slice(pre.length))) map[e.path] = e.sha;
    return { treeSha: c.tree.sha, map };
  },
  async blob(sha) { const b = await this.req('GET', `/git/blobs/${sha}`); return TD.decode(b64ToBuf(b.content)); },
  async commit(parent, treeSha, files, message) {
    const t = await this.req('POST', '/git/trees', { base_tree: treeSha, tree: files.map(f => f.content == null ? { path: f.path, mode: '100644', type: 'blob', sha: null } : { path: f.path, mode: '100644', type: 'blob', content: f.content }) });
    const c = await this.req('POST', '/git/commits', { message, tree: t.sha, parents: [parent] });
    await this.req('PATCH', `/git/refs/heads/${S.cfg.branch}`, { sha: c.sha });
    return c.sha;
  },
  commits(path) { return this.req('GET', `/commits?path=${encodeURIComponent(path)}&sha=${encodeURIComponent(S.cfg.branch)}&per_page=50`); },
  fileAt(path, ref) { return this.req('GET', `/contents/${path.split('/').map(encodeURIComponent).join('/')}?ref=${ref}`, null, true); }
};

async function chooseMine(msg) {
  const v = await modal({ title: 'Sync conflict', body: `<p>${esc(msg)}</p><p class="note">The version you don’t keep is still in the repository’s Git history.</p>`, ok: 'Keep this device’s version', alt: 'Use the repository version', cancel: false });
  return !(v && v._alt);
}
async function adoptRemote(local, rc) {
  if (local && local.locked && local.key && rc.locked && rc.enc) {
    try { rc.data = normData(await decryptJSON(rc.enc, local.key)); rc.key = local.key; rc.salt = local.salt; rc.iter = local.iter; } catch { /* PIN changed elsewhere; stays locked */ }
  }
  if (local) S.cats[S.cats.indexOf(local)] = rc; else S.cats.push(rc);
}

async function loadGithub() {
  setStatus('saving', 'Loading from GitHub…');
  const cache = await IDB.get('cache');
  const head = await GH.head();
  const { map } = await GH.tree(head);
  const remote = new Map();
  await Promise.all(Object.entries(map).map(async ([p, sha]) => {
    try { const c = parseCat(JSON.parse(await GH.blob(sha))); remote.set(c.id, { c, sha, p }); } catch (e) { console.warn('Skipping unreadable file', p, e); }
  }));
  const cats = [], deleted = new Set();
  const sameRepo = cache && cache.repo === repoKey();
  const fromLocal = cache && cache.repo === 'local';
  if (sameRepo || fromLocal) {
    for (const o of cache.cats || []) {
      if (!o._dirty) continue;
      const r = remote.get(o.id);
      const known = sameRepo ? cache.shas?.[catPath(o.id)] : undefined;
      if (r && r.sha !== known && !(await chooseMine(`“${o.name}” has unsynced changes on this device, and it was also changed in the repository.`))) continue;
      let c; try { c = parseCat(o); } catch { continue; }
      c.dirty = true; cats.push(c); remote.delete(o.id);
    }
    if (sameRepo) for (const p of cache.deleted || []) if (map[p] && !cats.some(c => catPath(c.id) === p)) { deleted.add(p); remote.delete(idFromPath(p)); }
  }
  for (const { c } of remote.values()) cats.push(c);
  S.cats = cats; S.base = head; S.shas = map; S.deleted = deleted;
  persist(); setStatus();
  if (cats.some(c => c.dirty) || deleted.size) pushSoon();
}

async function loadStatic() {
  const r = await fetch(`${dataPath()}/manifest.json?t=${Date.now()}`, { cache: 'no-store' });
  if (!r.ok) throw new Error('No manifest');
  const m = await r.json(); const cats = [];
  await Promise.all((m.cats || []).map(async x => {
    try { const rr = await fetch(`${dataPath()}/${x.file}?t=${Date.now()}`, { cache: 'no-store' }); cats.push(parseCat(await rr.json())); } catch { }
  }));
  return cats;
}

async function reconcileRemote(map) {
  const paths = new Set([...Object.keys(map), ...Object.keys(S.shas)]);
  for (const p of paths) {
    if (map[p] === S.shas[p]) continue;
    const id = idFromPath(p), local = catById(id);
    if (!map[p]) { if (local && !local.dirty) S.cats = S.cats.filter(c => c !== local); continue; }
    const rc = parseCat(JSON.parse(await GH.blob(map[p])));
    if (S.deleted.has(p)) {
      if (await chooseMine(`“${rc.name}” was deleted on this device but changed elsewhere. Keep it deleted?`)) continue;
      S.deleted.delete(p); await adoptRemote(null, rc); continue;
    }
    if (local && local.dirty && await chooseMine(`“${local.name}” was changed on another device since your last sync.`)) continue;
    await adoptRemote(local, rc);
  }
  S.shas = { ...map };
}

const pushSoon = debounce(() => push(), 1500);
async function push() {
  if (S.mode !== 'github' || S.editing) return;
  if (S.pushing) { S.pushAgain = true; return; }
  if (!S.cats.some(c => c.dirty) && !S.deleted.size) { setStatus(); return; }
  S.pushing = true; setStatus('saving');
  try {
    const head = await GH.head();
    const { treeSha, map } = await GH.tree(head);
    if (head !== S.base) await reconcileRemote(map);
    const pushed = S.cats.filter(c => c.dirty).map(c => ({ c, rev: c.rev }));
    const files = [];
    for (const { c } of pushed) files.push({ path: catPath(c.id), content: JSON.stringify(await serializeCat(c), null, 2) + '\n' });
    const dels = [...S.deleted].filter(p => map[p]);
    for (const p of dels) files.push({ path: p, content: null });
    files.push({ path: `${dataPath()}/manifest.json`, content: JSON.stringify(manifest(), null, 2) + '\n' });
    const msgs = [...S.msgs];
    const message = 'kb: ' + (msgs.length ? msgs.slice(0, 4).join('; ') + (msgs.length > 4 ? ` (+${msgs.length - 4} more)` : '') : 'Update knowledge base');
    let sha;
    try { sha = await GH.commit(head, treeSha, files, message); }
    catch (e) { if ((e.status === 422 || e.status === 409) && S.retries < 3) { S.retries++; S.pushAgain = true; return; } throw e; }
    S.retries = 0; S.base = sha;
    S.shas = (await GH.tree(sha)).map;
    for (const { c, rev } of pushed) if (c.rev === rev) c.dirty = false;
    S.deleted.clear(); S.msgs.clear();
    persist(); setStatus('synced');
  } catch (e) {
    console.error(e); setStatus('error', e.message);
    toast(e.status === 401 || e.status === 403 ? 'GitHub rejected the token. Check it in Settings.' : 'Saving to GitHub failed: ' + e.message, 'err');
  } finally {
    S.pushing = false;
    if (S.pushAgain) { S.pushAgain = false; setTimeout(push, 400); }
  }
}

function setStatus(kind, msg) {
  if (kind) { S.status = kind === 'synced' ? (S.cats.some(c => c.dirty) ? 'dirty' : 'synced') : kind; S.statusMsg = msg || ''; }
  else if (S.mode === 'github') { if (S.status !== 'saving' && S.status !== 'error') S.status = (S.cats.some(c => c.dirty) || S.deleted.size) ? 'dirty' : 'synced'; }
  else S.status = S.mode;
  renderStatus();
}

/* ---------- vars (TARGET etc.) — stored only on this device ---------- */
function getVars(catId) { const v = LS.get('vars.' + catId, null); return Array.isArray(v) && v.length ? v : [{ name: 'TARGET', value: '' }]; }
const setVars = (catId, v) => LS.set('vars.' + catId, v);

/* ---------- rendering helpers ---------- */
function hl(code, lang) {
  try { if (window.hljs && lang && lang !== 'plaintext' && hljs.getLanguage(lang)) return hljs.highlight(code, { language: lang, ignoreIllegals: true }).value; } catch { }
  return esc(code);
}
function renderCode(code, lang, vars) {
  const names = vars.map(v => v.name).filter(n => /^[A-Za-z_][A-Za-z0-9_]*$/.test(n)).sort((a, b) => b.length - a.length);
  if (!names.length) return { html: hl(code, lang), text: code };
  const alt = names.map(reEsc).join('|');
  const re = () => new RegExp(`\\{(${alt})\\}|\\b(${alt})\\b`, 'g');
  const val = n => (vars.find(v => v.name === n) || {}).value || '';
  const found = [];
  const tmp = code.replace(re(), (m, a, b) => { found.push(a || b); return `KBVARX${found.length - 1}X`; });
  const text = code.replace(re(), (m, a, b) => val(a || b) || m);
  const html = hl(tmp, lang).replace(/KBVARX(\d+)X/g, (m, i) => {
    const n = found[+i], v = val(n);
    return v ? `<span class="var" title="${esc(n)}">${esc(v)}</span>` : `<span class="var empty" title="Set ${esc(n)} in the top bar">${esc(n)}</span>`;
  });
  return { html, text };
}
function resolveName(name, preferCat) {

  for (const c of allUnlocked()) walk(c.data.children, n => { if (n.type === 'file' && n.name.toLowerCase() === lc && (!best || (c.id === preferCat && best.c.id !== preferCat))) best = { c, n }; });
  return best;
}
function md(src, catId) {

const tagChip = t => `<a class="tag" href="#/tags/${encodeURIComponent(t)}">#${esc(t)}</a>`;

function renderSidebar() {

function initTreeSort() {

function rebuildTree(c) {

    if (n.type === 'folder') { const sub = [...li.children].find(x => x.matches('ul.tl')); if (sub) n.children = read(sub); }

  const root = $('#sidebar .tl[data-parent="root"]'); if (!root) return;
  const next = read(root); let count = 0; walk(next, () => { count++; });
  if (count !== map.size) { render(); return; }

}

/* edit mode */
const lineEdit = l => `<div class="ed-line" data-line-id="${l.id}"><span class="grip line-drag" title="Drag to reorder">${ic('grip')}</span><div class="ed-line-f"><textarea class="code-in" data-f="line-code" rows="1" data-grow spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="Command or code (Enter = new line, Shift+Enter = line break)">${esc(l.code)}</textarea><input class="cmt-in" data-f="line-comment" value="${esc(l.comment)}" placeholder="Comment (optional)"></div><button class="ib sm danger" data-act="line-del" aria-label="Remove line" title="Remove line">${ic('x')}</button></div>`;

function viewTags(r) {

  if (sel.length) for (const c of allUnlocked()) walk(c.data.children, (n, ps) => { if (n.type === 'file' && sel.every(t => n.tags.includes(t))) res.push({ c, n, ps }); });

function renderMain() {
  const r = S.route, m = $('#main');

  else if (r.view === 'home') html = viewHome();

    else if (!c.data) html = viewUnlock(c);

  });

  if (eb && ctx) {

    });

}
function grow(t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 2 + 'px'; }

function render() { renderSidebar(); renderTop(); renderBanner(); renderMain(); }

/* ---------- routing ---------- */
function parseRoute() {

      if (n.type === 'file') text = n.boxes.map(b => b.title + '\n' + (b.kind === 'text' ? b.content : b.kind === 'code' ? b.lines.map(l => l.code + '  ' + l.comment).join('\n') : b.kind === 'refs' ? b.items.map(i => `${i.title} ${i.url} ${i.note}`).join('\n') : b.caption || '')).join('\n');
      out.push({ kind: n.type, c, n, ps, name: n.name, tags: n.tags || [], text });
    });
  }
  return out;
}

  };

    if (!terms.length) {

/* ---------- modal / menu / toast ---------- */
function modal(o) {
  return new Promise(res => {
    const el = document.createElement('div'); el.className = 'modal-bg';
    el.innerHTML = `<form class="modal ${o.wide ? 'wide' : ''}" novalidate role="dialog" aria-modal="true"><h2>${esc(o.title)}</h2><div class="m-body">${o.body || ''}</div><p class="m-err" hidden></p><div class="m-acts">${o.cancel !== false ? `<button type="button" class="btn" data-m="cancel">${esc(o.cancel || 'Cancel')}</button>` : ''}${o.alt ? `<button type="button" class="btn" data-m="alt">${esc(o.alt)}</button>` : ''}<button type="submit" class="btn ${o.danger ? 'danger-solid' : 'primary'}">${esc(o.ok || 'OK')}</button></div></form>`;
    $('#layer').append(el);
    const form = $('form', el), err = $('.m-err', form), submit = $('button[type=submit]', form);
    let closed = false;
    const done = v => { if (closed) return; closed = true; el.remove(); document.removeEventListener('keydown', onKey, true); res(v); };
    const onKey = e => { if (e.key === 'Escape' && $('#layer').lastElementChild === el) { e.stopPropagation(); done(null); } };
    document.addEventListener('keydown', onKey, true);
    el.addEventListener('mousedown', e => { if (e.target === el) done(null); });
    $('[data-m="cancel"]', el)?.addEventListener('click', () => done(null));
    $('[data-m="alt"]', el)?.addEventListener('click', () => done({ _alt: true }));
    form.addEventListener('submit', async e => {
      e.preventDefault();
      if (e.target !== form) return;
      const v = Object.fromEntries(new FormData(form));
      if (o.validate) {
        submit.disabled = true;
        const m = await o.validate(v);
        submit.disabled = false;
        if (m) { err.textContent = m; err.hidden = false; return; }
      }
      done(v);
    });
    o.onOpen?.(el, done);
    setTimeout(() => ($('[autofocus]', form) || $('input:not([type=checkbox]):not([type=file]),textarea,select', form) || submit)?.focus(), 20);
  });
}
const confirmDlg = async (title, msg, ok = 'OK', danger = false) => !!(await modal({ title, body: `<p>${esc(msg)}</p>`, ok, danger }));
function openMenu(anchor, items) {
  closeMenu();
  const m = document.createElement('div'); m.className = 'menu'; m.setAttribute('role', 'menu');
  m.innerHTML = items.map((it, i) => it === '-' ? '<hr>' : `<button role="menuitem" data-i="${i}" class="${it.danger ? 'danger' : ''}">${ic(it.icon || 'dot')}<span>${esc(it.label)}</span></button>`).join('');
  $('#layer').append(m);
  const r = anchor.getBoundingClientRect();
  let top = r.bottom + 4, left = Math.min(r.left, innerWidth - m.offsetWidth - 8);
  if (top + m.offsetHeight > innerHeight - 8) top = Math.max(8, r.top - m.offsetHeight - 4);
  m.style.top = top + 'px'; m.style.left = Math.max(8, left) + 'px';
  m.addEventListener('click', e => { const b = e.target.closest('button[data-i]'); if (b) { closeMenu(); items[+b.dataset.i].run(); } });
  S.menu = m;
  setTimeout(() => document.addEventListener('mousedown', menuOutside, true), 0);
  m.querySelector('button')?.focus();
}
function menuOutside(e) { if (S.menu && !S.menu.contains(e.target)) closeMenu(); }
function closeMenu() { S.menu?.remove(); S.menu = null; document.removeEventListener('mousedown', menuOutside, true); }
function toast(msg, kind) {

  try { await navigator.clipboard.writeText(text); return true; }
  catch { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.append(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch { } ta.remove(); return ok; }

/* ---------- settings, import/export ---------- */
async function exportData() {
  const cats = []; for (const c of S.cats) cats.push(await serializeCat(c));
  const blob = new Blob([JSON.stringify({ format: 'kb-export', v: 1, exported: new Date().toISOString(), cats }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `knowledge-base-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function importData(file) {

    const list = obj.format === 'kb-export' ? obj.cats : obj.format === 'kb-cat' ? [obj] : null;
    if (!list) throw new Error('This isn’t a knowledge base export.');
    let added = 0;

      const c = parseCat(o), ex = catById(c.id);
      if (ex) { if (!await confirmDlg(`Replace “${ex.name}”?`, 'A category with the same ID already exists. Replacing it overwrites its current contents (the old version stays in history if synced).', 'Replace', true)) continue; S.cats[S.cats.indexOf(ex)] = c; }
      else S.cats.push(c);

}
function openSettings() {

    title: 'Settings', ok: S.token ? 'Save and reconnect' : 'Connect GitHub', cancel: 'Close',

      <div class="m-sub">GitHub repository</div>

      <label class="chk"><input type="checkbox" name="remember" ${remember ? 'checked' : ''}> Remember the token on this device</label>
      <details class="help"><summary>How to create the token</summary><ol><li>Open <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">GitHub fine-grained tokens</a>.</li><li>Repository access: <b>Only select repositories</b>, and pick this site’s repository.</li><li>Repository permissions: <b>Contents: Read and write</b>. Nothing else is needed.</li><li>Set an expiry, generate, and paste it here. Add it once on each device you use.</li></ol><p class="note">The token is stored in this browser’s storage. Don’t use it on shared computers, and revoke it on GitHub if a device is lost.</p></details>
      <div class="m-sub">Backup</div>

      const token = v.token.trim() || S.token;

      catch (e) { S.loaded = true; setStatus('error', e.message); render(); return 'Loading failed: ' + e.message; }
      return null;
    }
  });
}

  else if (e.key === '/') { e.preventDefault(); openSearch(); }
  else if (e.key === 'e' && !mod && !S.editing && routeFile() && canEdit()) { e.preventDefault(); startEdit(); }
});
document.addEventListener('paste', e => {
  if (!S.editing) return;
  const x = editCtx(); if (!x) return;
  const img = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
  if (img) {
    e.preventDefault();
    const near = e.target.closest?.('.box.k-image') && boxOf(e.target, x.f);
    let b = near || x.f.boxes.find(bb => bb.kind === 'image' && !bb.src);
    if (!b) { b = newBox('image'); x.f.boxes.push(b); }
    setImage(b, img.getAsFile()); return;
  }
  const t = e.target;
  if (t.matches?.('.code-in')) {
    const txt = e.clipboardData.getData('text/plain');
    if (!txt.includes('\n')) return;
    e.preventDefault();
    const b = boxOf(t, x.f), line = lineOf(t, b), i = b.lines.indexOf(line);
    const parts = txt.replace(/\r\n?/g, '\n').replace(/\n+$/, '').split('\n');
    const before = t.value.slice(0, t.selectionStart), after = t.value.slice(t.selectionEnd);
    line.code = before + parts[0];
    const added = parts.slice(1).map(p => ({ id: uid(), code: p, comment: '' }));
    if (added.length) added[added.length - 1].code += after; else line.code += after;
    b.lines.splice(i + 1, 0, ...added);
    markEdit(); rerenderLines(b);
    const last = added[added.length - 1] || line; focusLine(last.id, last.code.length - after.length);
  }
});
document.addEventListener('dragover', e => {
  if (!S.editing || !e.dataTransfer?.types?.includes('Files')) return;
  e.preventDefault(); $$('.drop').forEach(d => d.classList.toggle('over', d.contains(e.target)));
});
document.addEventListener('drop', e => {
  if (!S.editing || !e.dataTransfer?.files?.length) return;
  e.preventDefault(); $$('.drop').forEach(d => d.classList.remove('over'));
  const x = editCtx(), zone = e.target.closest?.('.box.k-image');
  if (!x || !zone) { toast('Drop images onto an image box.'); return; }
  setImage(boxOf(zone, x.f), e.dataTransfer.files[0]);
});
['pointerdown', 'touchstart', 'scroll'].forEach(ev => addEventListener(ev, () => { S.lastActivity = Date.now(); }, { passive: true }));
setInterval(() => {
  if (Date.now() - S.lastActivity > AUTOLOCK_MS && !S.editing) {
    const open = S.cats.filter(c => c.locked && c.data);
    if (open.length) { open.forEach(lockNow); toast('Locked categories were locked again after 15 minutes of inactivity'); }
  }
}, 30000);
addEventListener('hashchange', onRoute);
addEventListener('beforeunload', e => { if (S.mode === 'github' && (S.cats.some(c => c.dirty) || S.deleted.size || S.pushing)) { e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && S.mode === 'github' && !S.editing && S.cats.some(c => c.dirty)) push(); });

/* ---------- boot ---------- */
async function init() {
  S.route = parseRoute();
  render();
  if (S.token && S.cfg.owner && S.cfg.repo) {
    S.mode = 'github';
    try { await loadGithub(); }
    catch (e) {
      console.error(e);
      const cache = await IDB.get('cache');
      if (cache && cache.repo === repoKey()) {
        S.cats = (cache.cats || []).map(o => { try { const c = parseCat(o); c.dirty = !!o._dirty; return c; } catch { return null; } }).filter(Boolean);
        S.base = cache.base; S.shas = cache.shas || {}; S.deleted = new Set(cache.deleted || []);
      }
      setStatus('error', e.message);
      toast(e.status === 401 ? 'GitHub rejected the saved token. Update it in Settings.' : 'Couldn’t reach GitHub. Showing the copy saved on this device.', 'err');
    }
  } else {
    let ok = false;
    if (/^https?:$/.test(location.protocol)) { try { S.cats = await loadStatic(); S.mode = 'readonly'; ok = true; } catch { } }
    if (!ok) {
      S.mode = 'local';
      const cache = await IDB.get('cache');
      if (cache?.cats) S.cats = cache.cats.map(o => { try { const c = parseCat(o); c.dirty = true; return c; } catch { return null; } }).filter(Boolean);
    }
  }
  S.loaded = true; setStatus(); onRoute();
}
init();
</script>
